<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141d" />
      <stop offset="50%" stop-color="#0f2b36" />
      <stop offset="100%" stop-color="#0b5550" />
    </linearGradient>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f2b36" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="1200" height="900" fill="url(#bgGrad)" />

  <!-- Glowing Radial Orbs -->
  <circle cx="900" cy="200" r="350" fill="url(#orbGlow)" />
  <circle cx="300" cy="700" r="400" fill="url(#orbGlow)" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#2dd4bf" stroke-width="1">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="900" fill="url(#grid)" />
  </g>

  <!-- Energy Circuit Lines -->
  <g stroke="url(#glowLine)" stroke-width="3" fill="none" filter="url(#neonGlow)">
    <path d="M -50 150 Q 300 80 600 250 T 1250 180" />
    <path d="M -50 350 Q 400 450 800 300 T 1250 500" />
    <path d="M -50 650 Q 250 500 700 750 T 1250 600" opacity="0.7" />
    
    <!-- Digital Node Connections -->
    <path d="M 200 100 L 200 300 L 450 300 L 450 550 L 750 550" stroke-dasharray="8 6" opacity="0.6" />
    <path d="M 650 150 L 850 150 L 850 400 L 1100 400" stroke-dasharray="12 8" opacity="0.5" />
  </g>

  <!-- Energy Nodes -->
  <g fill="#2dd4bf" filter="url(#neonGlow)">
    <circle cx="200" cy="300" r="6" />
    <circle cx="450" cy="300" r="7" />
    <circle cx="450" cy="550" r="6" />
    <circle cx="650" cy="150" r="8" />
    <circle cx="850" cy="400" r="7" />
    <circle cx="600" cy="250" r="9" />
    <circle cx="800" cy="300" r="8" />
  </g>

  <!-- Subtle Floating Energy Pulse -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="600" cy="250" r="3" />
    <circle cx="800" cy="300" r="3" />
    <circle cx="450" cy="300" r="2.5" />
  </g>
</svg>
